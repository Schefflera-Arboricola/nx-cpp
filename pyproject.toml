[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "nx-cpp"
version = "0.1.0"
description = "A small NetworkX backend written in C++"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.3"]

[project.optional-dependencies]
test = ["pytest"]

# These two entry points are what make this a NetworkX backend.
[project.entry-points."networkx.backends"]
cpp = "nx_cpp.interface:BackendInterface"

[project.entry-points."networkx.backend_info"]
cpp = "nx_cpp.interface:get_info"

[tool.scikit-build]
wheel.packages = ["python/nx_cpp"]
